services:
  latentforge:
    build: .
    ports:
      - "19526:19526"
    environment:
      # Optional: pre-set the worker token to skip first-run setup in the UI.
      # Leave unset for zero config — the UI prompts on first visit and stores
      # it in the data volume.
      LATENTFORGE_WORKER_TOKEN: ${LATENTFORGE_WORKER_TOKEN:-}
    volumes:
      - latentforge-data:/data
    restart: unless-stopped
    healthcheck:
      # slim image has no curl/wget; node fetch does the job
      test: ["CMD", "node", "-e", "fetch('http://localhost:19526/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # GPU worker, opt-in via `--profile worker` (CUDA hosts with
  # nvidia-container-toolkit only). `just up` is unaffected.
  worker:
    build: ./worker
    profiles: ["worker"]
    # Workers register under their hostname; give it a stable, readable one.
    hostname: "${LATENTFORGE_WORKER_NAME:-latentforge-gpu}"
    environment:
      LATENTFORGE_BACKEND_URL: http://latentforge:19526
      LATENTFORGE_WORKER_TOKEN: ${LATENTFORGE_WORKER_TOKEN:-}
    volumes:
      - "${LATENTFORGE_MODELS_DIR:-~/.latentforge/models}:/models:ro"
      - worker-hf-cache:/cache/huggingface
    depends_on:
      latentforge:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  latentforge-data:
  worker-hf-cache:
