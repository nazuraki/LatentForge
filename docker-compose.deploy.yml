# Image-based compose for externally managed deploys (e.g. a deploy control
# plane that git-clones this repo and runs `docker compose -f
# docker-compose.deploy.yml`). Mirrors what install.sh generates; the root
# docker-compose.yml builds from source and stays the dev entry point.
#
# Expects LATENTFORGE_WORKER_TOKEN (and, when the deployer's $HOME is not the
# host user's, an absolute LATENTFORGE_MODELS_DIR) in the environment or a
# `.env` next to the checkout root.
services:
  latentforge:
    image: ghcr.io/nazuraki/latentforge:latest
    ports:
      - "${LATENTFORGE_PORT:-19526}:19526"
    environment:
      LATENTFORGE_WORKER_TOKEN: ${LATENTFORGE_WORKER_TOKEN:-}
    volumes:
      - latentforge-data:/data
    restart: unless-stopped
    healthcheck:
      # slim image has no curl/wget; node fetch does the job
      test: ["CMD", "node", "-e", "fetch('http://localhost:19526/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # GPU worker, opt-in via the `worker` profile (CUDA hosts with
  # nvidia-container-toolkit only).
  worker:
    image: ghcr.io/nazuraki/latentforge-worker:latest
    profiles: ["worker"]
    # Workers register under their hostname; give it a stable, readable one.
    hostname: "${LATENTFORGE_WORKER_NAME:-latentforge-gpu}"
    environment:
      LATENTFORGE_BACKEND_URL: http://latentforge:19526
      LATENTFORGE_WORKER_TOKEN: ${LATENTFORGE_WORKER_TOKEN:-}
    volumes:
      - "${LATENTFORGE_MODELS_DIR:-~/.latentforge/models}:/models:ro"
      - worker-hf-cache:/cache/huggingface
    depends_on:
      latentforge:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # HTTPS front door for the UI/API (mirrors the nazu/backplane tls profile).
  # Certs are user-provided absolute host paths, mirrored into the container
  # so the path is valid as-is. The Caddyfile is generated inline by the
  # command — a relative bind mount would resolve against the host filesystem
  # when compose runs inside a container (e.g. backplane-managed deploys),
  # where the checkout doesn't exist. The :- defaults keep compose parseable
  # when tls is unconfigured. Enable with COMPOSE_PROFILES=tls in .env.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      # HTTP→HTTPS redirect. Override when :80 is taken on a shared host —
      # a failed port bind aborts the whole `up`.
      - "${LATENTFORGE_HTTP_PORT:-80}:80"
      # Mirrored (host port = container port): the Caddyfile site address
      # includes LATENTFORGE_HTTPS_PORT so redirect Locations stay correct on
      # non-standard ports.
      - "${LATENTFORGE_HTTPS_PORT:-443}:${LATENTFORGE_HTTPS_PORT:-443}"
    environment:
      LATENTFORGE_HOSTNAME: ${LATENTFORGE_HOSTNAME:-}
      LATENTFORGE_HTTPS_PORT: ${LATENTFORGE_HTTPS_PORT:-443}
      LATENTFORGE_TLS_CERT: ${LATENTFORGE_TLS_CERT:-}
      LATENTFORGE_TLS_KEY: ${LATENTFORGE_TLS_KEY:-}
    command:
      - sh
      - -c
      - |
        : "$${LATENTFORGE_HOSTNAME:?LATENTFORGE_HOSTNAME is required when the tls profile is active}"
        : "$${LATENTFORGE_TLS_CERT:?LATENTFORGE_TLS_CERT is required when the tls profile is active}"
        : "$${LATENTFORGE_TLS_KEY:?LATENTFORGE_TLS_KEY is required when the tls profile is active}"
        cat > /tmp/Caddyfile <<'CADDYFILE'
        {$$LATENTFORGE_HOSTNAME}:{$$LATENTFORGE_HTTPS_PORT} {
          tls {$$LATENTFORGE_TLS_CERT} {$$LATENTFORGE_TLS_KEY}
          reverse_proxy latentforge:19526
        }
        CADDYFILE
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    volumes:
      - ${LATENTFORGE_TLS_CERT:-/etc/ssl/latentforge/cert.pem}:${LATENTFORGE_TLS_CERT:-/etc/ssl/latentforge/cert.pem}:ro
      - ${LATENTFORGE_TLS_KEY:-/etc/ssl/latentforge/key.pem}:${LATENTFORGE_TLS_KEY:-/etc/ssl/latentforge/key.pem}:ro
      - caddy-data:/data
    restart: unless-stopped
    depends_on:
      - latentforge

volumes:
  latentforge-data:
  worker-hf-cache:
  caddy-data:
